<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SPI · Učenje</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Libre+Caslon+Display&family=Libre+Caslon+Text:wght@400;700&display=swap');
:root{--ink:#191815;--paper:#e8dfca;--paper2:#d9ceb5;--red:#7b1e24;--red2:#a33a3e;--muted:#756c5b;--line:#aaa087;--shadow:#0d0c0a}
*{box-sizing:border-box} body{margin:0;background:#171714;color:var(--ink);font-family:'Libre Caslon Text',Georgia,serif;background-image:radial-gradient(#37342d 1px,transparent 1px);background-size:4px 4px}
.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.paper{position:relative;background:var(--paper);min-height:100vh;padding:42px 42px 60px;box-shadow:0 18px 55px #000a;border:1px solid #6e6657;overflow:hidden}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(90deg,transparent 49.8%,#7f755f22 50%,transparent 50.2%),radial-gradient(circle at 20% 30%,#6e60431a 0 1px,transparent 2px);background-size:100% 100%,9px 9px}
.archive{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--red);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;display:flex;justify-content:space-between;gap:10px}
.hero{position:relative;padding:42px 180px 32px 0;border-bottom:4px double var(--ink)}
.kicker{font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:clamp(42px,7vw,74px);line-height:.9;margin:0;letter-spacing:-.035em;text-transform:uppercase}.sub{margin-top:18px;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.seal{position:absolute;right:10px;top:28px;width:138px;height:138px;border-radius:49% 51% 46% 54%/53% 45% 55% 47%;background:radial-gradient(circle at 37% 30%,#a33a3e,#781c22 56%,#531318 100%);color:#e8c9ae;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-7deg);box-shadow:0 4px 8px #0006,inset 0 0 0 5px #5f171b,inset 0 0 0 8px #a94b4d55;text-shadow:0 1px #4d1115;font-family:'Libre Caslon Text',serif}
.seal:before{content:"";position:absolute;inset:15px;border:1px solid #d69a8355;border-radius:50%}.seal b{font-size:34px;line-height:.9}.seal span{font:600 12px 'IBM Plex Mono';letter-spacing:.12em;margin-top:8px}
.timeline{display:flex;align-items:center;margin:24px 0 10px;font:600 10px 'IBM Plex Mono';letter-spacing:.08em;color:var(--muted)}.timeline .rail{height:2px;background:var(--line);flex:1;margin:0 9px;position:relative}.timeline .fill{height:100%;width:0;background:var(--red);transition:.3s}.timeline .rail:after{content:"1945     1961     1979     1989";position:absolute;top:7px;left:0;right:0;display:flex;word-spacing:5.2vw;white-space:pre;text-align:center;font-size:8px;color:#928873}
.progressbox{margin:28px 0 32px;border:1px solid var(--ink);padding:12px 14px;background:#ded4bd}.progressrow{display:flex;justify-content:space-between;font:600 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase}.bar{height:8px;background:#b8ad94;margin-top:9px;border:1px solid #746b59}.bar>div{height:100%;width:0;background:var(--red);transition:.25s}
.section-title{display:flex;align-items:center;gap:12px;margin:34px 0 14px;font:600 12px 'IBM Plex Mono';letter-spacing:.15em;text-transform:uppercase}.section-title:before,.section-title:after{content:"";height:1px;background:var(--ink);flex:1}.section-title strong{font-family:'Libre Caslon Text';font-size:19px;letter-spacing:.03em}
.q{position:relative;display:grid;grid-template-columns:58px 1fr 38px;align-items:center;min-height:70px;border-top:1px solid #9e947e;padding:9px 0;gap:12px}.q:last-child{border-bottom:1px solid #9e947e}.num{font:600 27px 'IBM Plex Mono';color:#716855}.q.done .num,.q.done .text{opacity:.45}.text{font-size:16px;line-height:1.35}.actions{display:flex;flex-direction:column;gap:4px}.check,.red{appearance:none;border:1px solid #615a4c;background:#eee6d4;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;font-size:17px}.check:checked:after{content:"✓";font-weight:bold}.red:after{content:"●";color:var(--red);text-shadow:0 1px #4d111522}.red:checked{background:linear-gradient(145deg,#9b363b,#68171d);border-color:#531318;box-shadow:inset 0 0 0 2px #b85b5d55}.red:checked:after{color:#e8c9ae;text-shadow:0 1px #4d1115}.q.flagged{background:linear-gradient(90deg,transparent,#8b202512 70%,#8b20251c)}
.pause{margin:24px 0 8px;width:100%;display:flex;align-items:center;gap:12px;font:600 11px 'IBM Plex Mono';letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}.pause::before,.pause::after{content:"";height:1px;background:#746b59;flex:1}.pause input{accent-color:var(--red);vertical-align:-2px}.pause.done{opacity:.45;text-decoration:line-through}
.redzone{margin-top:54px;padding-top:25px;border-top:5px double var(--red)}.classified{display:inline-block;color:var(--red);border:3px solid var(--red);padding:7px 14px;font:600 18px 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase;transform:rotate(-2deg);margin:0 0 12px}.redzone h2{font-family:'Libre Caslon Display';font-size:42px;font-weight:400;margin:8px 0 4px;text-transform:uppercase}.redzone .note{font:11px 'IBM Plex Mono';color:var(--muted);margin-bottom:20px}.empty{font-style:italic;color:var(--muted);padding:18px 0}.redzone .q{grid-template-columns:58px 1fr 38px}.redzone .q .red{display:none}
.footer{margin-top:45px;border-top:1px solid var(--ink);padding-top:10px;font:10px 'IBM Plex Mono';letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}
@media(max-width:650px){.paper{padding:28px 18px 45px}.hero{padding-right:0;padding-top:170px}.seal{left:50%;right:auto;transform:translateX(-50%) rotate(-7deg);top:18px}.archive{font-size:9px}.q{grid-template-columns:45px 1fr 34px}.num{font-size:22px}.text{font-size:15px}.timeline .rail:after{display:none}}
</style></head>
<body><div class="wrap"><main class="paper">
<div class="archive"><span>UČENJE · PRVI PROLAZ</span></div>
<header class="hero"><h1>Savremena<br>politička istorija</h1><div class="seal"><b>SPI</b><span>ISPIT</span></div></header>
<div class="timeline"><span>1939</span><div class="rail"><div class="fill" id="timelineFill"></div></div><span>1990-e</span></div>
<div class="progressbox"><div class="progressrow"><span>Kompletan prolaz</span><span id="progressText">0 / 45</span></div><div class="bar"><div id="progressBar"></div></div></div>
<div id="questions"></div>
<section class="redzone"><div class="classified">PONOVITI</div><h2>Crvena zona</h2><div id="redQuestions"></div></section>
<div class="footer"><span>FPN · ISPITNI DOSIJE</span><span>1939—1990-e</span></div>
</main></div>
<script>
const Q=["Tok Drugog svetskog rata 1939–1941. - Prva faza rata", "Tok Drugog svetskog rata 1941–1943. - Druga faza rata", "Tok Drugog svetskog rata 1943–1945. - Treća faza rata", "Pokreti otpora u Evropi tokom Drugog svetskog rata", "Podela Nemačke nakon Drugog svetskog rata", "Stvaranje socijalističkih država u Evropi nakon Drugog svetskog rata", "Početak Hladnog rata", "Stvaranje i delatnost Ujedinjenih nacija", "Prve hladnoratovske krize: Iran, Turska i Grčka", "Trumanova doktrina i Maršalov plan", "Stvaranje paktova i trka u naoružanju", "Kineski građanski rat (1946–1949)", "Japan nakon Drugog svetskog rata", "Rat u Koreji", "SAD za vreme Dvajta Ajzenhauera", "Dekolonizacija nakon Drugog svetskog rata", "Nezavisnost Indije", "Rat na prostoru Indokine (1945–1954)", "Bliski istok nakon Drugog svetskog rata i nastanak Izraela", "Suecka kriza 1956. godine", "SSSR za vreme Nikite Hruščova", "Revolucija u Mađarskoj 1956.", "Nastanak Pete republike u Francuskoj", "Integracija Zapadne Evrope i stvaranje EEZ", "Dekolonizacija i stvaranje nezavisnih država u Africi", "Pokret nesvrstanih", "Kubanska kriza", "Sukobi na Bliskom istoku 60-ih godina", "Kulturna revolucija u Kini", "Detant i ograničavanje trke u naoružanju 60-ih i 70-ih godina", "Učešće SAD u ratu u Vijetnamu", "Studentski protesti krajem 60-ih godina", "Istočna politika Vilija Branta", "Sukobi na Bliskom istoku 70-ih godina", "Rat u Avganistanu", "Velika Britanija za vreme Margaret Tačer", "SAD za vreme Ronalda Regana", "Kraj Hladnog rata", "SAD tokom 90-ih godina", "Slom socijalizma u Evropi", "Zalivski rat 1990–1991.", "Daleki istok 90-ih godina", "Stanje u Evropi 90-ih godina", "Rusija za vreme Borisa Jeljcina", "Bliski istok 90-ih godina"];
const BLOCKS=[[1, 3], [4, 5], [6, 8], [9, 11], [12, 13], [14, 15], [16, 18], [19, 21], [22, 23], [24, 25], [26, 27], [28, 28], [29, 30], [31, 32], [33, 33], [34, 35], [36, 37], [38, 38], [39, 39], [40, 40], [41, 42], [43, 43], [44, 45]];
const SESS=[[1, 8], [9, 15], [16, 23], [24, 28], [29, 33], [34, 38], [39, 43], [44, 45]];
const KEY='spi_ucenje_v1';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{done:{},red:{},redDone:{},pauses:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
function qrow(n,zone=false){let d=zone?!!S.redDone[n]:!!S.done[n],r=!!S.red[n];return `<div class="q ${d?'done':''} ${r?'flagged':''}" data-n="${n}" data-zone="${zone?1:0}"><div class="num">${String(n).padStart(2,'0')}</div><div class="text">${Q[n-1]}</div><div class="actions"><input class="check" type="checkbox" ${d?'checked':''} aria-label="Završeno">${zone?'':`<input class="red" type="checkbox" ${r?'checked':''} aria-label="Crvena zona">`}</div></div>`}
function sessHead(n){let k=SESS.findIndex(x=>x[0]===n);if(k<0)return '';let a=SESS[k][0],b=SESS[k][1],dn=0;for(let i=a;i<=b;i++)if(S.done[i])dn++;return `<div class="section-title"><strong>Dan ${k+1}</strong><span>pitanja ${a}–${b} · ${dn}/${b-a+1}</span></div>`}
function render(){let h='';BLOCKS.forEach((b,i)=>{h+=sessHead(b[0]);for(let n=b[0];n<=b[1];n++)h+=qrow(n);if(i<BLOCKS.length-1&&!SESS.some(x=>x[0]===BLOCKS[i+1][0])){let p=b[1];h+=`<label class="pause ${S.pauses[p]?'done':''}"><input type="checkbox" data-pause="${p}" ${S.pauses[p]?'checked':''}> ☕ PAUZA</label>`}});document.getElementById('questions').innerHTML=h;renderRed();bind();update()}
function renderRed(){let nums=Object.keys(S.red).filter(n=>S.red[n]).map(Number).sort((a,b)=>a-b);document.getElementById('redQuestions').innerHTML=nums.length?nums.map(n=>qrow(n,true)).join(''):'<div class="empty">Crvena zona je trenutno prazna.</div>'}
function bind(){document.querySelectorAll('.q .check').forEach(x=>x.onchange=e=>{let row=e.target.closest('.q'),n=row.dataset.n,z=row.dataset.zone==='1';(z?S.redDone:S.done)[n]=e.target.checked;save();render()});document.querySelectorAll('.q .red').forEach(x=>x.onchange=e=>{let n=e.target.closest('.q').dataset.n;S.red[n]=e.target.checked;if(!e.target.checked)delete S.redDone[n];save();render()});document.querySelectorAll('[data-pause]').forEach(x=>x.onchange=e=>{S.pauses[e.target.dataset.pause]=e.target.checked;save();render()})}
function update(){let c=Object.values(S.done).filter(Boolean).length,p=Math.round(c/Q.length*100);document.getElementById('progressText').textContent=`${c} / ${Q.length}`;document.getElementById('progressBar').style.width=p+'%';document.getElementById('timelineFill').style.width=p+'%'}
render();
</script></body></html>
